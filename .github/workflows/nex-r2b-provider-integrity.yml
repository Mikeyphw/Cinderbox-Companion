name: NEX-R2B Provider Integrity and JVM Mapping
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nex-r2b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Adversarial fixture contracts without credentials or network
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B scripts/devtool/nex_r2b_gate.py
          python3 -B -m unittest discover -s scripts/devtool -p 'test_nex_r2b_gate.py' -v
          python3 -B scripts/devtool/nex_r2_gate.py
          python3 -B scripts/devtool/nex_r1_gate.py
          python3 -B scripts/devtool/r48_gate.py
  hosted-jvm:
    needs: source-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Source-bound provider mapping and adversarial JVM tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest --tests 'com.sdvsync.mods.api.NexusProviderIntegrityTest'
