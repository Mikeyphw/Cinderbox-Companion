name: R48B Compact Real-UI Header Source Contract (no Gradle)
on:
  pull_request:
    paths:
      - 'app/src/main/java/com/sdvsync/ui/components/StardewTopAppBar.kt'
      - 'scripts/devtool/r48b_*'
      - '.github/workflows/r48b-compact-header-source.yml'
      - 'docs/security/M3_RELEASE_POLICY.json'
  push:
    branches: [master]
    paths:
      - 'app/src/main/java/com/sdvsync/ui/components/StardewTopAppBar.kt'
      - 'scripts/devtool/r48b_*'
      - '.github/workflows/r48b-compact-header-source.yml'
      - 'docs/security/M3_RELEASE_POLICY.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r48b-host-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify R48B compact header and previous device boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B scripts/devtool/r48b_layout_gate.py
          python3 -B -m unittest discover -s scripts/devtool -p 'test_r48b_layout_gate.py' -v
          python3 -B scripts/devtool/r48_gate.py
          python3 -B scripts/devtool/r43c_gate.py
