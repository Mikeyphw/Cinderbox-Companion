name: M25-03 R2A Journaled Bulk Fixture Qualification
on:
  pull_request:
    paths:
      - '.github/workflows/m25-bulk-transaction.yml'
      - 'app/src/main/java/com/sdvsync/mods/ModBulkTransaction.kt'
      - 'app/src/main/java/com/sdvsync/mods/ModProfileTransaction.kt'
      - 'app/src/test/java/com/sdvsync/mods/ModBulkTransactionTest.kt'
      - 'scripts/devtool/m25_bulk_gate.py'
      - 'docs/devtool/M25_03_R2A_JOURNALED_BULK_FIXTURE.md'
  push:
    branches: [master]
    paths:
      - '.github/workflows/m25-bulk-transaction.yml'
      - 'app/src/main/java/com/sdvsync/mods/ModBulkTransaction.kt'
      - 'app/src/test/java/com/sdvsync/mods/ModBulkTransactionTest.kt'
      - 'scripts/devtool/m25_bulk_gate.py'
      - 'docs/devtool/M25_03_R2A_JOURNALED_BULK_FIXTURE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Pinned source and fixtures, no Android mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B scripts/devtool/m25_bulk_gate.py
          python3 -B scripts/devtool/m25_group_gate.py
          python3 -B scripts/devtool/m25_profile_gate.py
          python3 -B scripts/devtool/m25_update_gate.py
          python3 -B scripts/devtool/r47_gate.py
          python3 -B scripts/devtool/r48_gate.py
  jvm-transaction-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: JVM-only byte preservation, journal recovery and rejection tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest --tests com.sdvsync.mods.ModBulkTransactionTest
