name: Cinderbox UX-08C — native save and backup review
on:
  pull_request:
    paths:
      - 'app/src/main/java/com/sdvsync/MainActivity.kt'
      - 'app/src/main/java/com/sdvsync/ui/screens/ApprovedSavesScreen.kt'
      - 'app/src/main/java/com/sdvsync/ui/screens/ApprovedSaveDeepScreen.kt'
      - 'app/src/androidTest/java/com/sdvsync/qualification/UX08CSaveReviewDeviceTest.kt'
      - 'scripts/devtool/ux08c_*'
      - 'scripts/devtool/test_ux08c_gate.py'
      - '.github/workflows/cinderbox-ux08c-save-review.yml'
      - 'docs/security/M3_RELEASE_POLICY.json'
  push:
    branches: [master]
    paths:
      - 'app/src/main/java/com/sdvsync/ui/screens/ApprovedSaveDeepScreen.kt'
      - 'app/src/main/java/com/sdvsync/MainActivity.kt'
      - 'app/src/main/java/com/sdvsync/ui/screens/ApprovedSavesScreen.kt'
      - 'scripts/devtool/ux08c_*'
      - '.github/workflows/cinderbox-ux08c-save-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cinderbox-ux08c-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Source, regression and release-safety gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B scripts/devtool/ux08c_gate.py
          python3 -B -m unittest discover -s scripts/devtool -p 'test_ux08c_gate.py' -v
          python3 -B scripts/devtool/ux08b_gate.py
          python3 -B scripts/devtool/ux08a_gate.py
          python3 -B scripts/devtool/ux_06_more_gate.py
          python3 -B scripts/devtool/ux_05_mods_gate.py
          python3 -B scripts/devtool/ux05bd_gate.py
          python3 -B scripts/devtool/ux_04_saves_gate.py
          python3 -B scripts/devtool/ux_03_game_gate.py
          python3 -B scripts/devtool/r45a_gate.py
          python3 -B scripts/devtool/r45r2_gate.py
          python3 -B scripts/devtool/r47_gate.py
          python3 -B scripts/devtool/r48_gate.py
  hosted-api36-synthetic:
    needs: host-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager --install 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Compile real Android app and synthetic test APKs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify hosted Linux KVM
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install hosted API 36 image
        run: sdkmanager --install 'system-images;android-36;google_apis;x86_64'
      - name: Capture three synthetic deep states on two portrait viewports
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/devtool/ux08c_emulator_ci.sh
      - name: Upload synthetic allowlisted screenshots and receipt
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ux08c-save-review-hosted-api36
          path: ${{ runner.temp }}/ux08c-save-review/
          if-no-files-found: warn
          retention-days: 14
