name: CB-NX06 LAB06B Hosted Synthetic Safety Matrix API36
on:
  pull_request:
    paths:
      - 'app/src/androidTest/java/com/sdvsync/mods/CbNxLab06bNegativeDeviceTest.kt'
      - 'scripts/devtool/cbnx06_lab06b_*.py'
      - 'scripts/devtool/cbnx06_lab06b_emulator_ci.sh'
      - 'app/src/main/java/com/sdvsync/mods/NexusLab04SyntheticTransaction.kt'
      - 'app/src/main/java/com/sdvsync/mods/NexusLab03DArchiveStage.kt'
      - 'docs/CBNX06_LAB06B_HOSTED_NEGATIVE_MATRIX.md'
      - '.github/workflows/cbnx06-lab06b-negative-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-negative-api36:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      CBNX_LAB06B_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Exact head, LAB06B negative contracts and inherited LAB05 policy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CBNX_LAB06B_HEAD_SHA"
          python3 -B scripts/devtool/cbnx06_lab06b_source_gate.py
          python3 -B scripts/devtool/cbnx06_lab06b_tests.py
          python3 -B scripts/devtool/cbnx06_lab05_source_gate.py
          python3 -B scripts/devtool/cbnx06_lab05_tests.py
          python3 -B scripts/devtool/cbnx06_lab04_source_gate.py
          python3 -B scripts/devtool/cbnx06_lab03d_source_gate.py
          bash -n scripts/devtool/cbnx06_lab06b_emulator_ci.sh
      - name: Hosted-only compile LAB app and Android test APK
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CBNX_LAB06B_HEAD_SHA"
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 -PcbnxLabAndroidTest=true :app:assembleCbnxLab :app:assembleCbnxLabAndroidTest
      - name: API36 emulator availability and KVM
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          python3 -B scripts/devtool/cbnx04_sdk_image_recovery.py
      - name: Five real isolated rejection and rollback replay device cases
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disk-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/devtool/cbnx06_lab06b_emulator_ci.sh
      - name: Publish only redacted synthetic negative matrix receipt
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: cbnx06-lab06b-negative-matrix-api36-receipt
          path: ${{ runner.temp }}/cbnx06-lab06b/STATUS.json
          if-no-files-found: warn
          retention-days: 14
