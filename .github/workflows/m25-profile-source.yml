name: M25 Portable Mod Profiles Source Contract (no Gradle)
on:
  pull_request:
    paths:
      - 'app/src/main/java/com/sdvsync/mods/**'
      - 'app/src/main/java/com/sdvsync/ui/viewmodels/ModManagerViewModel.kt'
      - 'app/src/main/java/com/sdvsync/ui/screens/ModManagerScreen.kt'
      - 'scripts/devtool/m25_profile_*'
      - 'scripts/devtool/test_m25_profile_*'
      - '.github/workflows/m25-profile-source.yml'
      - '.devtool.toml'
      - 'docs/security/M3_RELEASE_POLICY.json'
  push:
    branches: [master]
    paths:
      - 'app/src/main/java/com/sdvsync/mods/**'
      - 'app/src/main/java/com/sdvsync/ui/viewmodels/ModManagerViewModel.kt'
      - 'app/src/main/java/com/sdvsync/ui/screens/ModManagerScreen.kt'
      - 'scripts/devtool/m25_profile_*'
      - 'scripts/devtool/test_m25_profile_*'
      - '.github/workflows/m25-profile-source.yml'
      - '.devtool.toml'
      - 'docs/security/M3_RELEASE_POLICY.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Profile negative source checks and old safety gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B scripts/devtool/m25_profile_gate.py
          python3 -B -m unittest discover -s scripts/devtool -p 'test_m25_profile_gate.py' -v
          python3 -B scripts/devtool/r43c_gate.py
          python3 -B scripts/devtool/r48_gate.py
