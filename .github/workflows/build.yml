name: Build Debug APK

on:
  push:
    branches: [ main, master, 'security/**' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up pinned Android build tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35 and signing tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Validate debug-only source and signing policy
        run: python3 scripts/devtool/m3_build_evidence.py source

      - name: Run M3 source regression tests
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m3_*.py' -v

      - name: M3G Steam regression tests
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m3g_*.py' -v

      - name: M4 local-first safety regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m4_*.py' -v

      - name: M5 safe operations regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m5_*.py' -v

      - name: M6 interrupted download recovery regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m6_*.py' -v

      - name: M7 mod compatibility regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m7_*.py' -v

      - name: M7B preview and sanitized report regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m7b_*.py' -v

      - name: M8 crash-safe mod profile regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m8_*.py' -v

      - name: M9 atomic multi-mod transaction regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m9_*.py' -v

      - name: M10 selective verified game repair regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m10_*.py' -v

      - name: M11 capacity and save recovery regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m11_*.py' -v

      - name: M12 operation center and safe export regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m12_*.py' -v

      - name: M13 integration and release-gate regressions
        run: |
          python3 scripts/devtool/m13_qualification.py source
          python3 -m unittest discover -s scripts/devtool -p 'test_m13_*.py' -v

      - name: M16 persistent debug signing regressions
        run: |
          python3 scripts/devtool/m16_debug_signing.py source
          python3 -m unittest discover -s scripts/devtool -p 'test_m16_*.py' -v

      - name: M17 Android UI and lifecycle qualification regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m17_*.py' -v

      - name: M18 genuine process recovery host regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m18_*.py' -v

      - name: M24 selection, recovery and evidence source regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m24_gate.py' -v

      - name: M24 staging and crash-recovery source regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m24_staged_gate.py' -v

      - name: M24 verification phase and Android folder picker regressions
        run: |
          python3 -m unittest discover -s scripts/devtool -p 'test_m24_verify_ux_gate.py' -v
          python3 scripts/devtool/m24_verify_ux_gate.py

      - name: M24 shared depot parent PICS and setup source gate
        run: python3 scripts/devtool/m24_shared_depot_gate.py

      - name: M24 live PICS mismatch and progress source gate
        run: python3 scripts/devtool/m24_live_pics_progress_gate.py

      - name: M24 live depot handoff watchdog regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m24_depot_handoff_gate.py' -v

      - name: M24 live depot handoff source gate
        run: python3 scripts/devtool/m24_depot_handoff_gate.py --output "$RUNNER_TEMP/cinderbox-m24-handoff-source.json"

      - name: Upload M24 depot handoff source evidence
        uses: actions/upload-artifact@v4
        with:
          name: m24-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-m24-handoff-source.json

      - name: M24 cached depot file hash cross-check regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m24_file_manifest_gate.py' -v

      - name: M24 cached depot file proof source gate
        run: python3 scripts/devtool/m24_file_manifest_gate.py --output "$RUNNER_TEMP/cinderbox-m24-file-proof.json"

      - name: Upload M24 file proof source evidence
        uses: actions/upload-artifact@v4
        with:
          name: m24-file-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-m24-file-proof.json

      - name: M24 PICS depot manifest identity regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m24_pics_gate.py' -v

      - name: M24 PICS identity source gate
        run: python3 scripts/devtool/m24_pics_gate.py --output "$RUNNER_TEMP/cinderbox-m24-pics-source.json"

      - name: Upload M24 PICS source evidence
        uses: actions/upload-artifact@v4
        with:
          name: m24-pics-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-m24-pics-source.json

      - name: M24 CI APK provenance host regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m24_real_substrate.py' -v

      - name: M24 CI artifact/device provenance source gate
        run: python3 scripts/devtool/m24_provenance_gate.py --output "$RUNNER_TEMP/cinderbox-m24-provenance-source.json"

      - name: Upload M24 provenance source evidence
        uses: actions/upload-artifact@v4
        with:
          name: m24-provenance-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-m24-provenance-source.json
          if-no-files-found: error

      - name: M24 source-bound authenticated transfer safety gate
        run: python3 scripts/devtool/m24_gate.py --output "$RUNNER_TEMP/cinderbox-m24-host.json"

      - name: Upload M24 source-bound evidence
        uses: actions/upload-artifact@v4
        with:
          name: m24-host-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-m24-host.json
          if-no-files-found: error

      - name: M23 read-only installation discovery source regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m23_discovery.py' -v

      - name: M23 primary Cinderbox protection and destination regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m23_cinderbox_first.py' -v

      - name: M23 source-bound installation discovery gate
        run: python3 scripts/devtool/m23_discovery_gate.py --output "$RUNNER_TEMP/cinderbox-m23-host.json"

      - name: Upload M23 source-bound evidence
        uses: actions/upload-artifact@v4
        with:
          name: m23-host-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-m23-host.json
          if-no-files-found: error

      - name: M22 postmerge source baseline regression tests
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m22_baseline.py' -v

      - name: M22 source-bound read-only baseline and roadmap gate
        run: |
          python3 scripts/devtool/m22_baseline.py --output "$RUNNER_TEMP/cinderbox-m22-host.json"
          python3 scripts/devtool/m22_baseline.py --verify "$RUNNER_TEMP/cinderbox-m22-host.json" > /dev/null

      - name: Upload M22 source-bound baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: m22-host-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-m22-host.json
          if-no-files-found: error
          retention-days: 30

      - name: UI-D03 Devtool accessibility and screenshot source gate
        run: python3 scripts/devtool/ui_d03_gate.py --output "$RUNNER_TEMP/cinderbox-ui-d03-host.json"

      - name: Upload UI-D03 source evidence
        uses: actions/upload-artifact@v4
        with:
          name: ui-d03-host-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-ui-d03-host.json
          if-no-files-found: error
          retention-days: 14

      - name: UI-D02 Devtool source-bound component gate
        run: python3 scripts/devtool/ui_d02_gate.py --output "$RUNNER_TEMP/cinderbox-ui-d02-host.json"

      - name: Upload UI-D02 source evidence
        uses: actions/upload-artifact@v4
        with:
          name: ui-d02-host-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-ui-d02-host.json
          if-no-files-found: error
          retention-days: 14

      - name: UI-D01 Devtool source-bound appearance gate
        run: python3 scripts/devtool/ui_d01_gate.py --output "$RUNNER_TEMP/cinderbox-ui-d01-host.json"

      - name: Upload UI-D01 source evidence
        uses: actions/upload-artifact@v4
        with:
          name: ui-d01-host-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-ui-d01-host.json
          if-no-files-found: error
          retention-days: 14

      - name: M21 feature and release readiness source regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m21_*.py' -v

      - name: M20 consolidated 52-scenario host regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m20_*.py' -v

      - name: M19 interrupted download checkpoint recovery regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m19_*.py' -v

      - name: M14 device qualification runner regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m14_*.py' -v

      - name: M15 integrated Android qualification regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m15_*.py' -v

      - name: Enforce M3B non-publishing policy and regressions
        run: |
          python3 scripts/devtool/m3b_release_candidate.py policy
          python3 -m unittest discover -s scripts/devtool -p 'test_m3b_*.py' -v

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Offline M0/M1 security source contract
        run: python3 scripts/devtool/check_security_contract.py

      - name: M16 provision pinned debug signing key (CI only)
        env:
          CINDERBOX_DEBUG_KEYSTORE_B64: ${{ secrets.CINDERBOX_DEBUG_KEYSTORE_B64 }}
          CINDERBOX_DEBUG_STORE_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_STORE_PASSWORD }}
          CINDERBOX_DEBUG_KEY_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_KEY_PASSWORD }}
          CINDERBOX_DEBUG_CERT_SHA256: ${{ vars.CINDERBOX_DEBUG_CERT_SHA256 }}
        run: python3 scripts/devtool/m16_debug_signing.py provision --path "$RUNNER_TEMP/cinderbox-stable-debug.p12"

      - name: Test, lint, and build debug APK
        env:
          CINDERBOX_DEBUG_STORE_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_STORE_PASSWORD }}
          CINDERBOX_DEBUG_KEY_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: M16 verify pinned application APK signer
        env:
          CINDERBOX_DEBUG_CERT_SHA256: ${{ vars.CINDERBOX_DEBUG_CERT_SHA256 }}
        run: python3 scripts/devtool/m16_debug_signing.py verify --apk-dir app/build/outputs/apk/debug

      - name: Generate verified APK metadata and source evidence
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/devtool/m3_build_evidence.py generate \
            --apk-dir app/build/outputs/apk/debug \
            --output app/build/outputs/apk/debug/M3_PROVENANCE.json

      - name: Generate M13 debug qualification evidence
        env:
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -eq 1
          python3 scripts/devtool/m13_qualification.py finalize \
            --source-sha "$GITHUB_SHA" \
            --provenance app/build/outputs/apk/debug/M3_PROVENANCE.json \
            --apk "${apks[0]}" \
            --output app/build/outputs/apk/debug/M13_QUALIFICATION.json

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/M3_PROVENANCE.json
            app/build/outputs/apk/debug/M13_QUALIFICATION.json
          retention-days: 14
      - name: M23 synthetic Android test source contract
        run: |
          python3 -m unittest discover -s scripts/devtool -p 'test_m23_device_test_gate.py' -v
          python3 scripts/devtool/m23_device_test_gate.py --output "$RUNNER_TEMP/cinderbox-m23-android-source.json"

      - name: Upload M23 Android test source evidence
        uses: actions/upload-artifact@v4
        with:
          name: m23-android-source-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-m23-android-source.json
          if-no-files-found: error

      - name: M14 compile isolated Android instrumentation APK
        env:
          CINDERBOX_DEBUG_STORE_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_STORE_PASSWORD }}
          CINDERBOX_DEBUG_KEY_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebugAndroidTest

      - name: M16 verify pinned instrumentation APK signer
        env:
          CINDERBOX_DEBUG_CERT_SHA256: ${{ vars.CINDERBOX_DEBUG_CERT_SHA256 }}
        run: python3 scripts/devtool/m16_debug_signing.py verify --apk-dir app/build/outputs/apk/androidTest/debug

      - name: M14 upload isolated instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: m14-androidtest-apk
          if-no-files-found: error
          path: app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 14

