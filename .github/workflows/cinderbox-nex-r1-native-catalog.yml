name: Cinderbox NEX-R1 — API-first catalog filters and real native UI
on:
  pull_request:
    paths:
      - 'app/src/main/java/com/sdvsync/mods/api/NexusCatalog*.kt'
      - 'app/src/main/java/com/sdvsync/mods/api/NexusModSource.kt'
      - 'app/src/main/java/com/sdvsync/ui/viewmodels/ModBrowseViewModel.kt'
      - 'app/src/main/java/com/sdvsync/ui/screens/ApprovedModsScreen.kt'
      - 'app/src/test/java/com/sdvsync/mods/api/NexR1CatalogContractTest.kt'
      - 'app/src/androidTest/java/com/sdvsync/ui/ux/NexR1NativeFiltersTest.kt'
      - 'scripts/devtool/nex_r1_*'
      - 'scripts/devtool/test_nex_r1_*'
      - '.github/workflows/cinderbox-nex-r1-native-catalog.yml'
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cinderbox-nex-r1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Read-only source, regression and policy checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B scripts/devtool/nex_r1_gate.py
          python3 -B -m unittest discover -s scripts/devtool -p 'test_nex_r1_gate.py' -v
          python3 -B scripts/devtool/ux_05_mods_gate.py
          python3 -B -m unittest discover -s scripts/devtool -p 'test_ux_05_mods.py' -v
          python3 -B scripts/devtool/ux09d01_gate.py
          python3 -B scripts/devtool/ux09c02_gate.py
          bash -n scripts/devtool/nex_r1_emulator_ci.sh
  hosted-api36-real-native-filters:
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager --install 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Hosted JVM query tests, Debug APK and Android instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify hosted-only KVM
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Google API36 emulator image with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            if sdkmanager --install 'system-images;android-36;google_apis;x86_64'; then exit 0; fi
            test "$n" -lt 3 || exit 1
            sleep 10
          done
      - name: Strict native PNG decoder
        run: python3 -m pip install --user 'Pillow==11.3.0'
      - name: Actual MainActivity Mods and filter sheet at 360dp and 393dp
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/devtool/nex_r1_emulator_ci.sh
      - name: Publish actual native evidence or sanitized failure report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: nex-r1-real-native-catalog-api36
          path: ${{ runner.temp }}/nex-r1-real-evidence/
          if-no-files-found: warn
          retention-days: 14
