name: M25-03 R2C Isolated Bulk Commit Integration
on:
  pull_request:
    paths:
      - '.github/workflows/m25-bulk-r2c.yml'
      - 'app/src/main/java/com/sdvsync/mods/ModFileManager.kt'
      - 'app/src/androidTest/java/com/sdvsync/mods/ModBulkControlledFixtureDeviceTest.kt'
      - 'scripts/devtool/m25_bulk_r2b_gate.py'
      - 'scripts/devtool/m25_bulk_r2c_gate.py'
      - 'scripts/devtool/m25_r2c_emulator.sh'
      - 'docs/devtool/M25_03_R2C_ISOLATED_APPROVAL.md'
  push:
    branches: [master]
    paths:
      - '.github/workflows/m25-bulk-r2c.yml'
      - 'app/src/main/java/com/sdvsync/mods/ModFileManager.kt'
      - 'app/src/androidTest/java/com/sdvsync/mods/ModBulkControlledFixtureDeviceTest.kt'
      - 'scripts/devtool/m25_bulk_r2b_gate.py'
      - 'scripts/devtool/m25_bulk_r2c_gate.py'
      - 'scripts/devtool/m25_r2c_emulator.sh'
      - 'docs/devtool/M25_03_R2C_ISOLATED_APPROVAL.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m25-r2c-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-source-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Require fixture-only admission, original guards and release prohibition
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B scripts/devtool/m25_bulk_gate.py
          python3 -B scripts/devtool/m25_bulk_r2b_gate.py
          python3 -B scripts/devtool/m25_bulk_r2c_gate.py
          python3 -B scripts/devtool/m25_group_gate.py
          python3 -B scripts/devtool/m25_profile_gate.py
          python3 -B scripts/devtool/m25_update_gate.py
          python3 -B scripts/devtool/r47_gate.py
          python3 -B scripts/devtool/r48_gate.py
  hosted-compile:
    needs: [isolated-source-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Compile tests and application in hosted environment only
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest --tests com.sdvsync.mods.ModBulkTransactionTest
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest
  isolated-emulator:
    needs: [hosted-compile]
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager --install 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' 'system-images;android-36;google_apis;x86_64'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Require hosted Linux KVM
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run eight cache-only fixture cases
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/devtool/m25_r2c_emulator.sh
      - name: Export sanitized fixture receipt only
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: m25-r2c-isolated-api36-receipt
          path: ${{ runner.temp }}/m25-r2c-fixture/
          if-no-files-found: warn
          retention-days: 14
