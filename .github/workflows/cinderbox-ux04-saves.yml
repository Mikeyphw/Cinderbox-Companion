name: Cinderbox UX-04 — approved dark local-first Saves contracts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux04-saves-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check UX-04 and prevent privileged side effects
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B scripts/devtool/ux_00_01_source_gate.py
          python3 -B scripts/devtool/ux_03_game_gate.py
          python3 -B scripts/devtool/ux_04_saves_gate.py
          python3 -B -m unittest discover -s scripts/devtool -p 'test_ux_04_saves.py' -v
          python3 -B scripts/devtool/r43d_gate.py
          python3 -B scripts/devtool/r48_gate.py
          python3 -B scripts/devtool/m25_bulk_r2e_gate.py
