# Devtool ACTIONS-05 dispatch contract; matches devtool.actions_android._WORKFLOW.
# Source is selected by GitHub workflow_dispatch ref and later verified by Devtool.
# This workflow intentionally supports only debug APKs: no release credentials.
name: Devtool Android Build

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: 'Repository-relative Gradle root; Cinderbox uses .'
        type: string
        required: true
        default: '.'
      module:
        description: 'Android application module; Cinderbox uses app'
        type: string
        required: true
        default: 'app'
      variant:
        description: 'Debug build only (no release signing)'
        type: choice
        required: true
        options: ['debug']
      format:
        description: 'Android package format'
        type: choice
        required: true
        options: ['apk']
      a07_native_build:
        description: 'Native debug APK by default; set false for A05-only with native-only mode'
        type: boolean
        required: true
        default: true
      a05_mode:
        description: 'Native-only default; off selects legacy fallback; both runs legacy and A05'
        type: choice
        required: true
        default: 'native-only'
        options: ['off', 'native-only', 'both']

permissions:
  contents: read

concurrency:
  group: cinderbox-devtool-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A10: exactly one legacy implementation. Reuse the established full M3-M24
  # push/PR build workflow only when an operator selects a legacy mode.
  build-debug-apk:
    if: ${{ inputs.a05_mode != 'native-only' }}
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    secrets: inherit

  a07-native-debug-build:
    if: ${{ inputs.a07_native_build == true && inputs.a05_mode == 'native-only' }}
    name: A07 installed-wheel native debug DAG
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      A07_DEVTOOL_SHA: 409c5527532eaa1ee62b8111e030732d3f9e2791
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact Cinderbox commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 Node24
        with:
          persist-credentials: false
      - name: Validate exact source and debug-only native DAG
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = 'Mikeyphw/Cinderbox-Companion'
          python3 scripts/devtool/a07_native_debug.py source
          python3 scripts/devtool/m3_build_evidence.py source
          python3 scripts/devtool/m13_qualification.py source
          python3 scripts/devtool/m16_debug_signing.py source
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5 Node24
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4 Node24
        with:
          packages: platform-tools
      - name: Install fixed Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2 Node24
      - name: Install A06 wheel from immutable Devtool commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-a07-source"
          git -C "$RUNNER_TEMP/devtool-a07-source" checkout --detach "$A07_DEVTOOL_SHA"
          test "$(git -C "$RUNNER_TEMP/devtool-a07-source" rev-parse HEAD)" = "$A07_DEVTOOL_SHA"
          python3 -m venv "$RUNNER_TEMP/devtool-a07-venv"
          "$RUNNER_TEMP/devtool-a07-venv/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP/devtool-a07-source"
          unset PYTHONPATH
          "$RUNNER_TEMP/devtool-a07-venv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import devtool
          from devtool.core_parser import canonical_cli_schema
          source = Path(os.environ['RUNNER_TEMP']) / 'devtool-a07-source'
          wheel = Path(devtool.__file__).resolve()
          if source in wheel.parents or 'site-packages' not in wheel.parts:
              raise RuntimeError('CLI imported from source checkout, not installed wheel')
          if not (wheel.parent / 'core_cli_schema.json').is_file():
              raise RuntimeError('Installed A06 wheel lacks canonical CLI schema')
          if canonical_cli_schema().get('kind') != 'devtool.canonical-cli-schema':
              raise RuntimeError('Installed CLI schema invalid')
          print('PASS_A07_INSTALLED_WHEEL_SMOKE:', wheel)
          PY
          "$RUNNER_TEMP/devtool-a07-venv/bin/python" -m devtool --help >/dev/null
      - name: Native build DAG plan and preflight
        env:
          DEVTOOL_XDG_DIR: ${{ runner.temp }}/devtool-a07-state
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          PY="$RUNNER_TEMP/devtool-a07-venv/bin/python"
          "$PY" -m devtool --repo "$GITHUB_WORKSPACE" plan --target cinderbox build --json > "$RUNNER_TEMP/a07-plan.json"
          "$PY" -m devtool --repo "$GITHUB_WORKSPACE" preflight --target cinderbox --workflow build --json > "$RUNNER_TEMP/a07-preflight.json"
      - name: M16 provision pinned persistent debug signer
        env:
          CINDERBOX_DEBUG_KEYSTORE_B64: ${{ secrets.CINDERBOX_DEBUG_KEYSTORE_B64 }}
          CINDERBOX_DEBUG_STORE_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_STORE_PASSWORD }}
          CINDERBOX_DEBUG_KEY_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_KEY_PASSWORD }}
          CINDERBOX_DEBUG_CERT_SHA256: ${{ vars.CINDERBOX_DEBUG_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/devtool/m16_debug_signing.py provision --path "$RUNNER_TEMP/cinderbox-a07-debug.p12"
      - name: Invoke native security to APK to verification DAG
        shell: bash
        env:
          DEVTOOL_XDG_DIR: ${{ runner.temp }}/devtool-a07-state
          CINDERBOX_DEBUG_STORE_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_STORE_PASSWORD }}
          CINDERBOX_DEBUG_KEY_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unset PYTHONPATH
          chmod +x ./gradlew
          "$RUNNER_TEMP/devtool-a07-venv/bin/python" -m devtool --repo "$GITHUB_WORKSPACE" --machine-file "$RUNNER_TEMP/a07-invoke.json" invoke --target cinderbox build
      - name: Verify stable M16 debug APK signer
        env:
          CINDERBOX_DEBUG_CERT_SHA256: ${{ vars.CINDERBOX_DEBUG_CERT_SHA256 }}
        run: python3 scripts/devtool/m16_debug_signing.py verify --apk-dir app/build/outputs/apk/debug
      - name: Stage exactly one APK and generate existing M3 and M13 provenance
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -eq 1
          test -f "${apks[0]}" && test ! -L "${apks[0]}"
          stage="$RUNNER_TEMP/cinderbox-a07-apk"
          mkdir -p "$stage"
          cp -- "${apks[0]}" "$stage/debug.apk"
          (cd "$stage" && sha256sum debug.apk > SHA256SUMS)
          python3 scripts/devtool/m3_build_evidence.py generate --apk-dir "$stage" --output "$stage/M3_PROVENANCE.json"
          python3 scripts/devtool/m13_qualification.py finalize --source-sha "$GITHUB_SHA" --provenance "$stage/M3_PROVENANCE.json" --apk "$stage/debug.apk" --output "$stage/M13_QUALIFICATION.json"
      - name: Record exact native machine receipts and verify host evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/devtool/a07_native_debug.py record --input-dir "$RUNNER_TEMP" --evidence-dir "$RUNNER_TEMP/cinderbox-a07-evidence" --apk-dir "$RUNNER_TEMP/cinderbox-a07-apk"
          python3 scripts/devtool/a07_native_debug.py verify-local --input-dir "$RUNNER_TEMP/cinderbox-a07-evidence" --apk-dir "$RUNNER_TEMP/cinderbox-a07-apk" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Record bounded failure evidence
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/devtool/a07_native_debug.py record --incomplete --input-dir "$RUNNER_TEMP" --evidence-dir "$RUNNER_TEMP/cinderbox-a07-evidence"
      - name: Upload exact A07 machine evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5 Node24
        with:
          name: cinderbox-a07-machine-evidence
          path: ${{ runner.temp }}/cinderbox-a07-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Upload host-qualified debug APK (no device/release qualification)
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5 Node24
        with:
          name: cinderbox-a07-debug-apk
          path: ${{ runner.temp }}/cinderbox-a07-apk/
          if-no-files-found: error
          retention-days: 14

  # A05: source-only Devtool DAG. Independent of debug APK signing/build.
  # No Android device, Steam login or release material is used.
  a05-native-devtool-dag:
    if: ${{ inputs.a05_mode == 'native-only' || inputs.a05_mode == 'both' }}
    name: A05 native DAG + EXO evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      A05_DEVTOOL_SHA: 08eb13991b5d1c623b64fdd8f9524418ee27207e
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact consumer source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 Node24
        with:
          persist-credentials: false
      - name: Verify immutable consumer checkout and source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = 'Mikeyphw/Cinderbox-Companion'
          python3 scripts/devtool/a05_actions_qualification.py source
      - name: Install pinned Devtool A04 (no floating runtime)
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-a05"
          git -C "$RUNNER_TEMP/devtool-a05" checkout --detach "$A05_DEVTOOL_SHA"
          test "$(git -C "$RUNNER_TEMP/devtool-a05" rev-parse HEAD)" = "$A05_DEVTOOL_SHA"
          python3 -m venv "$RUNNER_TEMP/devtool-a05-venv"
          "$RUNNER_TEMP/devtool-a05-venv/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP/devtool-a05"
          # Source-bound runtime: the A04 wheel omits core_cli_schema.json.
          # The immutable checkout (verified above) is the import authority.
          test -s "$RUNNER_TEMP/devtool-a05/devtool/core_cli_schema.json"
          export PYTHONPATH="$RUNNER_TEMP/devtool-a05"
          "$RUNNER_TEMP/devtool-a05-venv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import devtool
          from devtool.core_parser import canonical_cli_schema
          expected = Path(os.environ['RUNNER_TEMP']) / 'devtool-a05' / 'devtool' / '__init__.py'
          actual = Path(devtool.__file__).resolve()
          if actual != expected.resolve():
              raise RuntimeError(f'Pinned source import mismatch: {actual}')
          canonical_cli_schema()
          PY
          "$RUNNER_TEMP/devtool-a05-venv/bin/python" -m devtool --help >/dev/null
      - name: Native target-local DAG plan and preflight
        shell: bash
        env:
          DEVTOOL_XDG_DIR: ${{ runner.temp }}/devtool-a05-state
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/devtool-a05"
          PY="$RUNNER_TEMP/devtool-a05-venv/bin/python"
          "$PY" -m devtool --repo "$GITHUB_WORKSPACE" plan --target cinderbox m24-verify-ux-check --json > "$RUNNER_TEMP/devtool-plan.json"
          "$PY" -m devtool --repo "$GITHUB_WORKSPACE" preflight --target cinderbox --workflow m24-verify-ux-check --json > "$RUNNER_TEMP/devtool-preflight.json"
      - name: Invoke native DAG and retain machine evidence
        shell: bash
        env:
          DEVTOOL_XDG_DIR: ${{ runner.temp }}/devtool-a05-state
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/devtool-a05"
          "$RUNNER_TEMP/devtool-a05-venv/bin/python" -m devtool --repo "$GITHUB_WORKSPACE" --machine-file "$RUNNER_TEMP/devtool-invoke.json" invoke --target cinderbox m24-verify-ux-check
      - name: Write bounded source/run/attempt evidence even after failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/devtool/a05_actions_qualification.py record \
            --evidence-dir "$RUNNER_TEMP/cinderbox-a05-evidence" \
            --input-dir "$RUNNER_TEMP" \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --devtool-sha "$A05_DEVTOOL_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload read-only A05 machine evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5 Node24
        with:
          name: cinderbox-a05-native-dag
          path: ${{ runner.temp }}/cinderbox-a05-evidence/
          if-no-files-found: error
          retention-days: 14
