# Devtool ACTIONS-05 dispatch contract; matches devtool.actions_android._WORKFLOW.
# Source is selected by GitHub workflow_dispatch ref and later verified by Devtool.
# This workflow intentionally supports only debug APKs: no release credentials.
name: Devtool Android Build

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: 'Repository-relative Gradle root; Cinderbox uses .'
        type: string
        required: true
        default: '.'
      module:
        description: 'Android application module; Cinderbox uses app'
        type: string
        required: true
        default: 'app'
      variant:
        description: 'Debug build only (no release signing)'
        type: choice
        required: true
        options: ['debug']
      format:
        description: 'Android package format'
        type: choice
        required: true
        options: ['apk']
      a07_native_build:
        description: 'Opt in to A07 native debug APK DAG (requires a05_mode=native-only)'
        type: boolean
        required: true
        default: false
      a05_mode:
        description: 'A05 native source DAG only, both lanes, or preserve existing Android build'
        type: choice
        required: true
        default: 'off'
        options: ['off', 'native-only', 'both']

permissions:
  contents: read

concurrency:
  group: cinderbox-devtool-android-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-debug-apk:
    if: ${{ inputs.a05_mode != 'native-only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify source identity and restrict task parameters
        shell: bash
        env:
          DT_PROJECT: ${{ inputs.project_dir }}
          DT_MODULE: ${{ inputs.module }}
          DT_VARIANT: ${{ inputs.variant }}
          DT_FORMAT: ${{ inputs.format }}
        run: |
          set -euo pipefail
          test "$DT_PROJECT" = '.'
          test "$DT_MODULE" = 'app'
          test "$DT_VARIANT" = 'debug'
          test "$DT_FORMAT" = 'apk'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f ./gradlew && test ! -L ./gradlew
          test -f app/build.gradle.kts && test ! -L app/build.gradle.kts
          test -f scripts/devtool/check_security_contract.py
          test -f scripts/devtool/verify_debug_apk.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned compile SDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Check M3 debug-only CI policy
        run: python3 scripts/devtool/m3_build_evidence.py source

      - name: Run M3 evidence contract regression tests
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m3_*.py' -v

      - name: M3G Steam regression tests
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m3g_*.py' -v

      - name: M4 local-first safety regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m4_*.py' -v

      - name: M5 safe operations regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m5_*.py' -v

      - name: M6 interrupted download recovery regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m6_*.py' -v

      - name: M7 mod compatibility regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m7_*.py' -v

      - name: M7B preview and sanitized report regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m7b_*.py' -v

      - name: M8 crash-safe mod profile regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m8_*.py' -v

      - name: M9 atomic multi-mod transaction regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m9_*.py' -v

      - name: M10 selective verified game repair regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m10_*.py' -v

      - name: M11 capacity and save recovery regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m11_*.py' -v

      - name: M12 operation center and safe export regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m12_*.py' -v

      - name: M13 integration and release-gate regressions
        run: |
          python3 scripts/devtool/m13_qualification.py source
          python3 -m unittest discover -s scripts/devtool -p 'test_m13_*.py' -v

      - name: M16 persistent debug signing regressions
        run: |
          python3 scripts/devtool/m16_debug_signing.py source
          python3 -m unittest discover -s scripts/devtool -p 'test_m16_*.py' -v

      - name: M17 Android UI and lifecycle qualification regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m17_*.py' -v

      - name: M18 genuine process recovery host regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m18_*.py' -v

      - name: M24 Android folder picker and verification progress source gate
        run: python3 scripts/devtool/m24_verify_ux_gate.py

      - name: M24 selection, recovery and evidence source regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m24_gate.py' -v

      - name: M24 staging and crash-recovery source regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m24_staged_gate.py' -v

      - name: M24 cached depot file hash cross-check regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m24_file_manifest_gate.py' -v

      - name: M24 cached depot file proof source gate
        run: python3 scripts/devtool/m24_file_manifest_gate.py --output "$RUNNER_TEMP/cinderbox-m24-file-proof.json"

      - name: Upload M24 file proof source evidence
        uses: actions/upload-artifact@v4
        with:
          name: m24-file-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-m24-file-proof.json

      - name: M24 PICS depot manifest identity regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m24_pics_gate.py' -v

      - name: M24 PICS identity source gate
        run: python3 scripts/devtool/m24_pics_gate.py --output "$RUNNER_TEMP/cinderbox-m24-pics-source.json"

      - name: Upload M24 PICS source evidence
        uses: actions/upload-artifact@v4
        with:
          name: m24-pics-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-m24-pics-source.json

      - name: M24 CI APK provenance host regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m24_real_substrate.py' -v

      - name: M24 CI artifact/device provenance source gate
        run: python3 scripts/devtool/m24_provenance_gate.py --output "$RUNNER_TEMP/cinderbox-m24-provenance-source.json"

      - name: Upload M24 provenance source evidence
        uses: actions/upload-artifact@v4
        with:
          name: m24-provenance-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-m24-provenance-source.json
          if-no-files-found: error

      - name: M24 source-bound authenticated transfer safety gate
        run: python3 scripts/devtool/m24_gate.py --output "$RUNNER_TEMP/cinderbox-m24-host.json"

      - name: Upload M24 source-bound evidence
        uses: actions/upload-artifact@v4
        with:
          name: m24-host-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-m24-host.json
          if-no-files-found: error

      - name: M23 read-only installation discovery source regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m23_discovery.py' -v

      - name: M23 primary Cinderbox protection and destination regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m23_cinderbox_first.py' -v

      - name: M23 source-bound installation discovery gate
        run: python3 scripts/devtool/m23_discovery_gate.py --output "$RUNNER_TEMP/cinderbox-m23-host.json"

      - name: Upload M23 source-bound evidence
        uses: actions/upload-artifact@v4
        with:
          name: m23-host-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-m23-host.json
          if-no-files-found: error

      - name: M22 postmerge source baseline regression tests
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m22_baseline.py' -v

      - name: M22 source-bound read-only baseline and roadmap gate
        run: |
          python3 scripts/devtool/m22_baseline.py --output "$RUNNER_TEMP/cinderbox-m22-host.json"
          python3 scripts/devtool/m22_baseline.py --verify "$RUNNER_TEMP/cinderbox-m22-host.json" > /dev/null

      - name: Upload M22 source-bound baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: m22-host-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-m22-host.json
          if-no-files-found: error
          retention-days: 30

      - name: UI-D03 Devtool accessibility and screenshot source gate
        run: python3 scripts/devtool/ui_d03_gate.py --output "$RUNNER_TEMP/cinderbox-ui-d03-host.json"

      - name: Upload UI-D03 source evidence
        uses: actions/upload-artifact@v4
        with:
          name: ui-d03-host-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-ui-d03-host.json
          if-no-files-found: error
          retention-days: 14

      - name: UI-D02 Devtool source-bound component gate
        run: python3 scripts/devtool/ui_d02_gate.py --output "$RUNNER_TEMP/cinderbox-ui-d02-host.json"

      - name: Upload UI-D02 source evidence
        uses: actions/upload-artifact@v4
        with:
          name: ui-d02-host-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-ui-d02-host.json
          if-no-files-found: error
          retention-days: 14

      - name: UI-D01 Devtool source-bound appearance gate
        run: python3 scripts/devtool/ui_d01_gate.py --output "$RUNNER_TEMP/cinderbox-ui-d01-host.json"

      - name: Upload UI-D01 source evidence
        uses: actions/upload-artifact@v4
        with:
          name: ui-d01-host-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-ui-d01-host.json
          if-no-files-found: error
          retention-days: 14

      - name: M21 feature and release readiness source regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m21_*.py' -v

      - name: M20 consolidated 52-scenario host regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m20_*.py' -v

      - name: M19 interrupted download checkpoint recovery regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m19_*.py' -v

      - name: M14 device qualification runner regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m14_*.py' -v

      - name: Enforce M3B non-publishing policy and regressions
        run: |
          python3 scripts/devtool/m3b_release_candidate.py policy
          python3 -m unittest discover -s scripts/devtool -p 'test_m3b_*.py' -v

      - name: Check M0/M1 security invariants
        run: python3 scripts/devtool/check_security_contract.py

      - name: M16 provision pinned debug signing key (CI only)
        env:
          CINDERBOX_DEBUG_KEYSTORE_B64: ${{ secrets.CINDERBOX_DEBUG_KEYSTORE_B64 }}
          CINDERBOX_DEBUG_STORE_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_STORE_PASSWORD }}
          CINDERBOX_DEBUG_KEY_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_KEY_PASSWORD }}
          CINDERBOX_DEBUG_CERT_SHA256: ${{ vars.CINDERBOX_DEBUG_CERT_SHA256 }}
        run: python3 scripts/devtool/m16_debug_signing.py provision --path "$RUNNER_TEMP/cinderbox-stable-debug.p12"

      - name: Unit tests, Android lint, assemble debug APK
        env:
          CINDERBOX_DEBUG_STORE_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_STORE_PASSWORD }}
          CINDERBOX_DEBUG_KEY_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 --build-cache --console=plain \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: M16 verify pinned application APK signer
        env:
          CINDERBOX_DEBUG_CERT_SHA256: ${{ vars.CINDERBOX_DEBUG_CERT_SHA256 }}
        run: python3 scripts/devtool/m16_debug_signing.py verify --apk-dir app/build/outputs/apk/debug

      - name: Verify assembled APK structure
        run: python3 scripts/devtool/verify_debug_apk.py

      - name: Stage exactly one APK with SHA-256 and source evidence
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo 'Expected exactly one debug APK' >&2
            exit 2
          fi
          test -f "${apks[0]}" && test ! -L "${apks[0]}"
          stage="$RUNNER_TEMP/cinderbox-devtool-debug"
          mkdir -p -- "$stage"
          cp -- "${apks[0]}" "$stage/debug.apk"
          (
            cd "$stage"
            sha256sum debug.apk > SHA256SUMS
          )
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'workflow_run=%s\n' "$GITHUB_RUN_ID"
            printf 'variant=debug\nformat=apk\nmodule=app\n'
          } > "$stage/BUILD_INFO.txt"
          test -s "$stage/debug.apk"
          cat "$stage/SHA256SUMS"

      - name: Inspect APK signature and record M3 source provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/devtool/m3_build_evidence.py generate \
            --apk-dir "$RUNNER_TEMP/cinderbox-devtool-debug" \
            --output "$RUNNER_TEMP/cinderbox-devtool-debug/M3_PROVENANCE.json"

      - name: Generate M13 debug qualification evidence
        env:
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/devtool/m13_qualification.py finalize \
            --source-sha "$GITHUB_SHA" \
            --provenance "$RUNNER_TEMP/cinderbox-devtool-debug/M3_PROVENANCE.json" \
            --apk "$RUNNER_TEMP/cinderbox-devtool-debug/debug.apk" \
            --output "$RUNNER_TEMP/cinderbox-devtool-debug/M13_QUALIFICATION.json"

      - name: Upload debug APK for Devtool Actions collection
        uses: actions/upload-artifact@v4
        with:
          name: devtool-android-debug-apk
          path: |
            ${{ runner.temp }}/cinderbox-devtool-debug/debug.apk
            ${{ runner.temp }}/cinderbox-devtool-debug/SHA256SUMS
            ${{ runner.temp }}/cinderbox-devtool-debug/BUILD_INFO.txt
            ${{ runner.temp }}/cinderbox-devtool-debug/M3_PROVENANCE.json
            ${{ runner.temp }}/cinderbox-devtool-debug/M13_QUALIFICATION.json
          if-no-files-found: error
          retention-days: 14
      - name: M23 synthetic Android test source contract
        run: |
          python3 -m unittest discover -s scripts/devtool -p 'test_m23_device_test_gate.py' -v
          python3 scripts/devtool/m23_device_test_gate.py --output "$RUNNER_TEMP/cinderbox-m23-android-source.json"

      - name: Upload M23 Android test source evidence
        uses: actions/upload-artifact@v4
        with:
          name: m23-android-source-${{ github.run_id }}
          path: ${{ runner.temp }}/cinderbox-m23-android-source.json
          if-no-files-found: error

      - name: M14 compile isolated Android instrumentation APK
        env:
          CINDERBOX_DEBUG_STORE_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_STORE_PASSWORD }}
          CINDERBOX_DEBUG_KEY_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebugAndroidTest

      - name: M16 verify pinned instrumentation APK signer
        env:
          CINDERBOX_DEBUG_CERT_SHA256: ${{ vars.CINDERBOX_DEBUG_CERT_SHA256 }}
        run: python3 scripts/devtool/m16_debug_signing.py verify --apk-dir app/build/outputs/apk/androidTest/debug

      - name: M14 upload isolated instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: m14-androidtest-apk
          if-no-files-found: error
          path: app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 14

  a07-native-debug-build:
    if: ${{ inputs.a07_native_build == true && inputs.a05_mode == 'native-only' }}
    name: A07 installed-wheel native debug DAG
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      A07_DEVTOOL_SHA: 409c5527532eaa1ee62b8111e030732d3f9e2791
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact Cinderbox commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate exact source and debug-only native DAG
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = 'Mikeyphw/Cinderbox-Companion'
          python3 scripts/devtool/a07_native_debug.py source
          python3 scripts/devtool/m3_build_evidence.py source
          python3 scripts/devtool/m13_qualification.py source
          python3 scripts/devtool/m16_debug_signing.py source
      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install fixed Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install A06 wheel from immutable Devtool commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-a07-source"
          git -C "$RUNNER_TEMP/devtool-a07-source" checkout --detach "$A07_DEVTOOL_SHA"
          test "$(git -C "$RUNNER_TEMP/devtool-a07-source" rev-parse HEAD)" = "$A07_DEVTOOL_SHA"
          python3 -m venv "$RUNNER_TEMP/devtool-a07-venv"
          "$RUNNER_TEMP/devtool-a07-venv/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP/devtool-a07-source"
          unset PYTHONPATH
          "$RUNNER_TEMP/devtool-a07-venv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import devtool
          from devtool.core_parser import canonical_cli_schema
          source = Path(os.environ['RUNNER_TEMP']) / 'devtool-a07-source'
          wheel = Path(devtool.__file__).resolve()
          if source in wheel.parents or 'site-packages' not in wheel.parts:
              raise RuntimeError('CLI imported from source checkout, not installed wheel')
          if not (wheel.parent / 'core_cli_schema.json').is_file():
              raise RuntimeError('Installed A06 wheel lacks canonical CLI schema')
          if canonical_cli_schema().get('kind') != 'devtool.canonical-cli-schema':
              raise RuntimeError('Installed CLI schema invalid')
          print('PASS_A07_INSTALLED_WHEEL_SMOKE:', wheel)
          PY
          "$RUNNER_TEMP/devtool-a07-venv/bin/python" -m devtool --help >/dev/null
      - name: Native build DAG plan and preflight
        env:
          DEVTOOL_XDG_DIR: ${{ runner.temp }}/devtool-a07-state
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          PY="$RUNNER_TEMP/devtool-a07-venv/bin/python"
          "$PY" -m devtool --repo "$GITHUB_WORKSPACE" plan --target cinderbox build --json > "$RUNNER_TEMP/a07-plan.json"
          "$PY" -m devtool --repo "$GITHUB_WORKSPACE" preflight --target cinderbox --workflow build --json > "$RUNNER_TEMP/a07-preflight.json"
      - name: M16 provision pinned persistent debug signer
        env:
          CINDERBOX_DEBUG_KEYSTORE_B64: ${{ secrets.CINDERBOX_DEBUG_KEYSTORE_B64 }}
          CINDERBOX_DEBUG_STORE_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_STORE_PASSWORD }}
          CINDERBOX_DEBUG_KEY_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_KEY_PASSWORD }}
          CINDERBOX_DEBUG_CERT_SHA256: ${{ vars.CINDERBOX_DEBUG_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/devtool/m16_debug_signing.py provision --path "$RUNNER_TEMP/cinderbox-a07-debug.p12"
      - name: Invoke native security to APK to verification DAG
        shell: bash
        env:
          DEVTOOL_XDG_DIR: ${{ runner.temp }}/devtool-a07-state
          CINDERBOX_DEBUG_STORE_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_STORE_PASSWORD }}
          CINDERBOX_DEBUG_KEY_PASSWORD: ${{ secrets.CINDERBOX_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unset PYTHONPATH
          chmod +x ./gradlew
          "$RUNNER_TEMP/devtool-a07-venv/bin/python" -m devtool --repo "$GITHUB_WORKSPACE" --machine-file "$RUNNER_TEMP/a07-invoke.json" invoke --target cinderbox build
      - name: Verify stable M16 debug APK signer
        env:
          CINDERBOX_DEBUG_CERT_SHA256: ${{ vars.CINDERBOX_DEBUG_CERT_SHA256 }}
        run: python3 scripts/devtool/m16_debug_signing.py verify --apk-dir app/build/outputs/apk/debug
      - name: Stage exactly one APK and generate existing M3 and M13 provenance
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -eq 1
          test -f "${apks[0]}" && test ! -L "${apks[0]}"
          stage="$RUNNER_TEMP/cinderbox-a07-apk"
          mkdir -p "$stage"
          cp -- "${apks[0]}" "$stage/debug.apk"
          (cd "$stage" && sha256sum debug.apk > SHA256SUMS)
          python3 scripts/devtool/m3_build_evidence.py generate --apk-dir "$stage" --output "$stage/M3_PROVENANCE.json"
          python3 scripts/devtool/m13_qualification.py finalize --source-sha "$GITHUB_SHA" --provenance "$stage/M3_PROVENANCE.json" --apk "$stage/debug.apk" --output "$stage/M13_QUALIFICATION.json"
      - name: Record exact native machine receipts and verify host evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/devtool/a07_native_debug.py record --input-dir "$RUNNER_TEMP" --evidence-dir "$RUNNER_TEMP/cinderbox-a07-evidence" --apk-dir "$RUNNER_TEMP/cinderbox-a07-apk"
          python3 scripts/devtool/a07_native_debug.py verify-local --input-dir "$RUNNER_TEMP/cinderbox-a07-evidence" --apk-dir "$RUNNER_TEMP/cinderbox-a07-apk" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Record bounded failure evidence
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/devtool/a07_native_debug.py record --incomplete --input-dir "$RUNNER_TEMP" --evidence-dir "$RUNNER_TEMP/cinderbox-a07-evidence"
      - name: Upload exact A07 machine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinderbox-a07-machine-evidence
          path: ${{ runner.temp }}/cinderbox-a07-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Upload host-qualified debug APK (no device/release qualification)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinderbox-a07-debug-apk
          path: ${{ runner.temp }}/cinderbox-a07-apk/
          if-no-files-found: error
          retention-days: 14

  # A05: source-only Devtool DAG. Independent of debug APK signing/build.
  # No Android device, Steam login or release material is used.
  a05-native-devtool-dag:
    if: ${{ inputs.a05_mode == 'native-only' || inputs.a05_mode == 'both' }}
    name: A05 native DAG + EXO evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      A05_DEVTOOL_SHA: 08eb13991b5d1c623b64fdd8f9524418ee27207e
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact consumer source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify immutable consumer checkout and source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = 'Mikeyphw/Cinderbox-Companion'
          python3 scripts/devtool/a05_actions_qualification.py source
      - name: Install pinned Devtool A04 (no floating runtime)
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-a05"
          git -C "$RUNNER_TEMP/devtool-a05" checkout --detach "$A05_DEVTOOL_SHA"
          test "$(git -C "$RUNNER_TEMP/devtool-a05" rev-parse HEAD)" = "$A05_DEVTOOL_SHA"
          python3 -m venv "$RUNNER_TEMP/devtool-a05-venv"
          "$RUNNER_TEMP/devtool-a05-venv/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP/devtool-a05"
          # Source-bound runtime: the A04 wheel omits core_cli_schema.json.
          # The immutable checkout (verified above) is the import authority.
          test -s "$RUNNER_TEMP/devtool-a05/devtool/core_cli_schema.json"
          export PYTHONPATH="$RUNNER_TEMP/devtool-a05"
          "$RUNNER_TEMP/devtool-a05-venv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import devtool
          from devtool.core_parser import canonical_cli_schema
          expected = Path(os.environ['RUNNER_TEMP']) / 'devtool-a05' / 'devtool' / '__init__.py'
          actual = Path(devtool.__file__).resolve()
          if actual != expected.resolve():
              raise RuntimeError(f'Pinned source import mismatch: {actual}')
          canonical_cli_schema()
          PY
          "$RUNNER_TEMP/devtool-a05-venv/bin/python" -m devtool --help >/dev/null
      - name: Native target-local DAG plan and preflight
        shell: bash
        env:
          DEVTOOL_XDG_DIR: ${{ runner.temp }}/devtool-a05-state
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/devtool-a05"
          PY="$RUNNER_TEMP/devtool-a05-venv/bin/python"
          "$PY" -m devtool --repo "$GITHUB_WORKSPACE" plan --target cinderbox m24-verify-ux-check --json > "$RUNNER_TEMP/devtool-plan.json"
          "$PY" -m devtool --repo "$GITHUB_WORKSPACE" preflight --target cinderbox --workflow m24-verify-ux-check --json > "$RUNNER_TEMP/devtool-preflight.json"
      - name: Invoke native DAG and retain machine evidence
        shell: bash
        env:
          DEVTOOL_XDG_DIR: ${{ runner.temp }}/devtool-a05-state
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/devtool-a05"
          "$RUNNER_TEMP/devtool-a05-venv/bin/python" -m devtool --repo "$GITHUB_WORKSPACE" --machine-file "$RUNNER_TEMP/devtool-invoke.json" invoke --target cinderbox m24-verify-ux-check
      - name: Write bounded source/run/attempt evidence even after failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/devtool/a05_actions_qualification.py record \
            --evidence-dir "$RUNNER_TEMP/cinderbox-a05-evidence" \
            --input-dir "$RUNNER_TEMP" \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --devtool-sha "$A05_DEVTOOL_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload read-only A05 machine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinderbox-a05-native-dag
          path: ${{ runner.temp }}/cinderbox-a05-evidence/
          if-no-files-found: error
          retention-days: 14
