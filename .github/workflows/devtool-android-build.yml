# Devtool ACTIONS-05 dispatch contract; matches devtool.actions_android._WORKFLOW.
# Source is selected by GitHub workflow_dispatch ref and later verified by Devtool.
# This workflow intentionally supports only debug APKs: no release credentials.
name: Devtool Android Build

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: 'Repository-relative Gradle root; Cinderbox uses .'
        type: string
        required: true
        default: '.'
      module:
        description: 'Android application module; Cinderbox uses app'
        type: string
        required: true
        default: 'app'
      variant:
        description: 'Debug build only (no release signing)'
        type: choice
        required: true
        options: ['debug']
      format:
        description: 'Android package format'
        type: choice
        required: true
        options: ['apk']

permissions:
  contents: read

concurrency:
  group: cinderbox-devtool-android-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify source identity and restrict task parameters
        shell: bash
        env:
          DT_PROJECT: ${{ inputs.project_dir }}
          DT_MODULE: ${{ inputs.module }}
          DT_VARIANT: ${{ inputs.variant }}
          DT_FORMAT: ${{ inputs.format }}
        run: |
          set -euo pipefail
          test "$DT_PROJECT" = '.'
          test "$DT_MODULE" = 'app'
          test "$DT_VARIANT" = 'debug'
          test "$DT_FORMAT" = 'apk'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f ./gradlew && test ! -L ./gradlew
          test -f app/build.gradle.kts && test ! -L app/build.gradle.kts
          test -f scripts/devtool/check_security_contract.py
          test -f scripts/devtool/verify_debug_apk.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned compile SDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Check M3 debug-only CI policy
        run: python3 scripts/devtool/m3_build_evidence.py source

      - name: Run M3 evidence contract regression tests
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m3_*.py' -v

      - name: M3G Steam regression tests
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m3g_*.py' -v

      - name: M4 local-first safety regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m4_*.py' -v

      - name: M5 safe operations regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m5_*.py' -v

      - name: M6 interrupted download recovery regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m6_*.py' -v

      - name: M7 mod compatibility regressions
        run: python3 -m unittest discover -s scripts/devtool -p 'test_m7_*.py' -v

      - name: Enforce M3B non-publishing policy and regressions
        run: |
          python3 scripts/devtool/m3b_release_candidate.py policy
          python3 -m unittest discover -s scripts/devtool -p 'test_m3b_*.py' -v

      - name: Check M0/M1 security invariants
        run: python3 scripts/devtool/check_security_contract.py

      - name: Unit tests, Android lint, assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 --build-cache --console=plain \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify assembled APK structure
        run: python3 scripts/devtool/verify_debug_apk.py

      - name: Stage exactly one APK with SHA-256 and source evidence
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo 'Expected exactly one debug APK' >&2
            exit 2
          fi
          test -f "${apks[0]}" && test ! -L "${apks[0]}"
          stage="$RUNNER_TEMP/cinderbox-devtool-debug"
          mkdir -p -- "$stage"
          cp -- "${apks[0]}" "$stage/debug.apk"
          (
            cd "$stage"
            sha256sum debug.apk > SHA256SUMS
          )
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'workflow_run=%s\n' "$GITHUB_RUN_ID"
            printf 'variant=debug\nformat=apk\nmodule=app\n'
          } > "$stage/BUILD_INFO.txt"
          test -s "$stage/debug.apk"
          cat "$stage/SHA256SUMS"

      - name: Inspect APK signature and record M3 source provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/devtool/m3_build_evidence.py generate \
            --apk-dir "$RUNNER_TEMP/cinderbox-devtool-debug" \
            --output "$RUNNER_TEMP/cinderbox-devtool-debug/M3_PROVENANCE.json"

      - name: Upload debug APK for Devtool Actions collection
        uses: actions/upload-artifact@v4
        with:
          name: devtool-android-debug-apk
          path: |
            ${{ runner.temp }}/cinderbox-devtool-debug/debug.apk
            ${{ runner.temp }}/cinderbox-devtool-debug/SHA256SUMS
            ${{ runner.temp }}/cinderbox-devtool-debug/BUILD_INFO.txt
            ${{ runner.temp }}/cinderbox-devtool-debug/M3_PROVENANCE.json
          if-no-files-found: error
          retention-days: 14
