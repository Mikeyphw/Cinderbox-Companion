name: Cinderbox UX-09D01 — normal-size chrome, navigation and status-bar fidelity
on:
  pull_request:
    paths:
      - 'app/src/main/java/com/sdvsync/MainActivity.kt'
      - 'app/src/main/java/com/sdvsync/ui/screens/OperationCenterScreen.kt'
      - 'app/src/main/java/com/sdvsync/ui/components/CinderboxBrandTopBar.kt'
      - 'app/src/main/java/com/sdvsync/ui/screens/ApprovedModsScreen.kt'
      - 'app/src/main/java/com/sdvsync/ui/screens/ApprovedSavesScreen.kt'
      - 'app/src/main/java/com/sdvsync/ui/screens/ApprovedMoreScreen.kt'
      - 'app/src/androidTest/java/com/sdvsync/ui/ux/UxNormalChromeTest.kt'
      - 'scripts/devtool/ux09d01_*'
      - 'scripts/devtool/test_ux09d01_gate.py'
      - '.github/workflows/cinderbox-ux09d01-normal-visual.yml'
  push:
    branches: [master]
    paths:
      - 'app/src/main/java/com/sdvsync/MainActivity.kt'
      - 'app/src/main/java/com/sdvsync/ui/screens/OperationCenterScreen.kt'
      - 'app/src/main/java/com/sdvsync/ui/components/CinderboxBrandTopBar.kt'
      - 'app/src/main/java/com/sdvsync/ui/screens/ApprovedModsScreen.kt'
      - 'app/src/main/java/com/sdvsync/ui/screens/ApprovedSavesScreen.kt'
      - 'app/src/main/java/com/sdvsync/ui/screens/ApprovedMoreScreen.kt'
      - 'app/src/androidTest/java/com/sdvsync/ui/ux/UxNormalChromeTest.kt'
      - 'scripts/devtool/ux09d01_*'
      - '.github/workflows/cinderbox-ux09d01-normal-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cinderbox-ux09d01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate unchanged approved goldens, routing and normal-size visual contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B scripts/devtool/ux09d01_gate.py
          python3 -B -m unittest discover -s scripts/devtool -p 'test_ux09d01_gate.py' -v
          python3 -B scripts/devtool/ux09c02_gate.py
          python3 -B -m unittest discover -s scripts/devtool -p 'test_m4_local_first.py' -v
  hosted-api36-normal-ui:
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager --install 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Compile app and androidTest APK (hosted only)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Require hosted disposable KVM
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: SDK image download with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            if sdkmanager --install 'system-images;android-36;google_apis;x86_64'; then exit 0; fi
            test "$n" -lt 3 || { echo UX09D01_SDK_FAILED >&2; exit 1; }
            sleep 10
          done
      - name: Capture three real tabs at 393 and 360 dp, default font only
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/devtool/ux09d01_emulator_ci.sh
      - name: Publish six native screenshots or failure summary
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ux09d01-normal-font-brand-header-api36
          path: ${{ runner.temp }}/ux09d01-normal-visual/
          if-no-files-found: warn
          retention-days: 14
