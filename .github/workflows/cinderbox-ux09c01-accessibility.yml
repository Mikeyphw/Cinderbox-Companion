name: Cinderbox UX-09C01 — real offline large-text, touch targets and IME
on:
  pull_request:
    paths:
      - 'app/src/androidTest/java/com/sdvsync/ui/ux/**'
      - 'scripts/devtool/ux09c_*'
      - 'scripts/devtool/test_ux09c_gate.py'
      - '.github/workflows/cinderbox-ux09c01-accessibility.yml'
      - 'app/src/main/java/com/sdvsync/ui/theme/CinderboxDarkTokens.kt'
      - 'docs/security/M3_RELEASE_POLICY.json'
      - 'design/cinderbox/02_CONTRACT/**'
  push:
    branches: [master]
    paths:
      - 'app/src/androidTest/java/com/sdvsync/ui/ux/**'
      - 'scripts/devtool/ux09c_*'
      - '.github/workflows/cinderbox-ux09c01-accessibility.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cinderbox-ux09c01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Offline source, contrast, reference and safety checks; no image dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B scripts/devtool/ux09c_gate.py
          python3 -B -m unittest discover -s scripts/devtool -p 'test_ux09c_gate.py' -v
          python3 -B scripts/devtool/ux09b4_gate.py
          python3 -B scripts/devtool/ux09b3_gate.py
          python3 -B scripts/devtool/ux09b2_gate.py
          python3 -B scripts/devtool/ux09b_gate.py
          python3 -B scripts/devtool/ux09a_gate.py
  hosted-api36-accessibility:
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager --install 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Hosted debug app and instrumentation APK only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify disposable hosted KVM
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install Google API36 emulator system image with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager --install 'system-images;android-36;google_apis;x86_64'; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then echo UX09C_SDK_IMAGE_INSTALL_FAILED >&2; exit 1; fi
            sleep 10
          done
      - name: Actual 200 percent text tests at 393dp and 360dp; 10 native screenshots
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/devtool/ux09c_emulator_ci.sh
      - name: Publish sanitized large-text screenshots, assertions and provenance
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ux09c01-200-percent-text-two-sizes-api36
          path: ${{ runner.temp }}/ux09c-large-text/
          if-no-files-found: warn
          retention-days: 14
