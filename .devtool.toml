[targets.cinderbox.jobs.m23-discovery]
runner = "command"
command = ["python3", "scripts/devtool/m23_discovery_gate.py"]
inputs = ["scripts/devtool/m23_discovery_gate.py", "app/src/main/java/com/sdvsync/local/M23InstallationDiscovery.kt", "app/src/main/java/com/sdvsync/local/InstallationScanner.kt", "app/src/main/java/com/sdvsync/ui/screens/InstallationHealthScreen.kt", "app/src/main/java/com/sdvsync/ui/viewmodels/GameDownloadViewModel.kt", "app/src/test/java/com/sdvsync/local/M23InstallationDiscoveryTest.kt", ".github/workflows/**", "docs/devtool/M23_INSTALLATION_DISCOVERY.md"]
metadata = { read_only = true, area = "m23-installation-discovery", evidence = "source-bound-json", device_required = false, root_required = false }

[targets.cinderbox.jobs.connected-tests]
runner = "android"
gradle_tasks = [":app:connectedDebugAndroidTest"]
metadata = { area = "device", explicit_only = true }

