# Cinderbox Companion / Devtool — Android source validation and debug APK.
# This repository is untrusted configuration, not permission authority.
# Production/release signing is intentionally NOT configured here.
[project]
runner = "android"
platform = "android"

[workspace]
default_target = "cinderbox"

[wrapper]
schema = 2
default_command = "validate"

[wrapper.commands.quick]
description = "Verify the security contract and run local JVM tests"
workflow = "quick"
target = "cinderbox"

[wrapper.commands.security]
description = "Check privileged-access and Android manifest regressions without Gradle"
workflow = "security"
target = "cinderbox"

[wrapper.commands.test]
description = "Run Android debug JVM unit tests"
devtool = "test"
target = "cinderbox"
allow_passthrough = true

[wrapper.commands.lint]
description = "Run Android lint for the debug variant"
devtool = "lint"
target = "cinderbox"
allow_passthrough = true

[wrapper.commands.build]
description = "Build and verify a debug APK (not a release APK)"
workflow = "build"
target = "cinderbox"

[wrapper.commands.validate]
description = "Run Devtool's Android-aware validation with persistent evidence"
devtool = "validate"
target = "cinderbox"
allow_passthrough = true

[wrapper.commands.full]
description = "Run security, unit tests, lint, and debug APK assembly"
workflow = "full"
target = "cinderbox"

[wrapper.commands.format-check]
description = "Run Kotlin lint formatting checks (does not alter source)"
workflow = "format-check"
target = "cinderbox"

[wrapper.commands.m17-check]
description = "M17 offline UI qualification source and runner host tests"
workflow = "m17-check"
target = "cinderbox"

[wrapper.commands.m18-check]
description = "M18 process stop/relaunch qualification host tests (read-only)"
workflow = "m18-check"
target = "cinderbox"

[wrapper.commands.m21-check]
description = "M21 consolidated feature, authenticated and release acceptance source tests"
workflow = "m21-check"
target = "cinderbox"

[wrapper.commands.m20-check]
description = "M20 consolidated 52-scenario source and safety host tests"
workflow = "m20-check"
target = "cinderbox"

[wrapper.commands.m19-check]
description = "M19 interrupted operation and recovery host tests (read-only)"
workflow = "m19-check"
target = "cinderbox"

[wrapper.commands.m15-check]
description = "M15 offline source and fail-closed integration runner regression checks"
workflow = "m15-check"
target = "cinderbox"

[wrapper.commands.earthy-check]
description = "UI-D01 source-bound appearance gate using Devtool DAG and EXO history"
workflow = "earthy-check"
target = "cinderbox"

[wrapper.commands.earthy-full]
description = "UI-D01 source gate, unit tests, lint, and verified debug APK"
workflow = "earthy-full"
target = "cinderbox"

[wrapper.commands.earthy-d02-check]
description = "UI-D02 original Earthy components source verification DAG"
workflow = "earthy-d02-check"
target = "cinderbox"

[wrapper.commands.earthy-d02-full]
description = "UI-D02 source and existing Android compile/lint/debug verification DAG"
workflow = "earthy-d02-full"
target = "cinderbox"

[wrapper.commands.earthy-d03-check]
description = "UI-D03 accessibility, contrast and synthetic screenshot source-bound DAG"
workflow = "earthy-d03-check"
target = "cinderbox"

[wrapper.commands.earthy-d03-full]
description = "UI-D03 source plus existing test/lint/debug verified APK DAG"
workflow = "earthy-d03-full"
target = "cinderbox"

[wrapper.commands.m22-check]
description = "M22 read-only baseline, historical anchors, source/CI and DAG integrity"
workflow = "m22-check"
target = "cinderbox"

[wrapper.commands.m22-full]
description = "M22 checks plus existing unit, lint and verified debug APK jobs"
workflow = "m22-full"
target = "cinderbox"

[wrapper.commands.m23-check]
description = "M23 read-only installation recognition and source-bound evidence DAG"
workflow = "m23-check"
target = "cinderbox"

[wrapper.commands.m23-full]
description = "M23 discovery plus existing Android unit, lint and debug APK qualification DAG"
workflow = "m23-full"
target = "cinderbox"

[wrapper.commands.device]
description = "Explicit on-device instrumentation lane; requires a connected test device"
workflow = "device"
target = "cinderbox"

[execution]
environment = "auto"
chroot_name = "androidos"

# Prefer in-place Termux builds to avoid an unnecessary chroot copy/bind on ARM64.
# Override with `devtool --chroot androidos ...` if local SDK providers require it.
[targets.cinderbox]
runner = "android"
platform = "android"
root = "."
execution_environment = "auto"
inputs = [".devtool.toml", "devtoolw", "gradlew", "gradle/**", "settings.gradle.kts", "build.gradle.kts", "gradle.properties", "app/**", "scripts/devtool/**", "docs/devtool/**", ".github/workflows/**"]
outputs = ["app/build/**", "build/**"]

[targets.cinderbox.android]
variant = "debug"
aapt2_provider = "auto"
sdk_provider = "auto"
prefer_native_termux = true
instrumentation = "disabled"

[targets.cinderbox.android.storage]
auto_cleanup = "safe"
min_free_mb = 4096
target_free_mb = 6144
managed_gradle_retention = 2
manage_gradle_user_cache = false
keep_provider_downloads = false
cleanup_after_build = true

[targets.cinderbox.gradle]
max_workers = 2
parallel = false
no_daemon = false
daemon_idle_timeout_ms = 900000
build_cache = true
structured_events = false
args = ["-Dorg.gradle.vfs.watch=false"]

# Actual Gradle tasks from the checked-in :app project. No invented composite task.
[targets.cinderbox.tasks]
build = [":app:assembleDebug"]
test = [":app:testDebugUnitTest"]
lint = [":app:lintDebug"]
clean = [":app:clean"]
instrumentation = [":app:connectedDebugAndroidTest"]

[targets.cinderbox.artifacts]
# Unit-test and lint jobs produce no APK; the debug-build job has its own verification gate.
required = false
external_verification = "auto"

[targets.cinderbox.validation]
android_safe = true
split_gradle = false
max_workers = 2
cpu_limit = 2
parallel = false
no_daemon = false
low_priority = false
memory_guard_mb = 0
gradle_heap_mb = 1152
gradle_metaspace_mb = 512
gradle_packaging_metaspace_mb = 640
gradle_lint_metaspace_mb = 640
affected_module_lint = true

[targets.cinderbox.validation.phases]
preflight = []
dependencies = []
compile = []
resources = []
unit-test = [":app:testDebugUnitTest"]
package = [":app:assembleDebug"]
lint = [":app:lintDebug"]

# This job is cheap and works even before JDK, Gradle, or the Android SDK exists.
[targets.cinderbox.jobs.security-contract]
runner = "command"
command = ["python3", "scripts/devtool/check_security_contract.py"]
inputs = ["app/src/main/AndroidManifest.xml", "app/src/main/java/com/sdvsync/fileaccess/**", "scripts/devtool/check_security_contract.py"]
metadata = { read_only = true, area = "security", root_required = false }

[targets.cinderbox.jobs.unit-tests]
runner = "android"
gradle_tasks = [":app:testDebugUnitTest"]
inputs = ["app/src/**", "app/build.gradle.kts", "gradle/**", "build.gradle.kts", "settings.gradle.kts"]
metadata = { area = "unit-tests" }

[targets.cinderbox.jobs.android-lint]
runner = "android"
gradle_tasks = [":app:lintDebug"]
inputs = ["app/src/**", "app/build.gradle.kts", "gradle/**", "build.gradle.kts", "settings.gradle.kts"]
metadata = { area = "android-lint" }

[targets.cinderbox.jobs.debug-apk]
runner = "android"
gradle_tasks = [":app:assembleDebug"]
inputs = ["app/src/**", "app/build.gradle.kts", "gradle/**", "build.gradle.kts", "settings.gradle.kts"]
outputs = ["app/build/outputs/apk/debug/**"]
metadata = { area = "debug-build", release_signed = false }

[targets.cinderbox.jobs.verify-debug-apk]
runner = "command"
command = ["python3", "scripts/devtool/verify_debug_apk.py"]
inputs = ["scripts/devtool/verify_debug_apk.py", "app/build/outputs/apk/debug/**"]
metadata = { read_only = true, area = "debug-artifact", release_signed = false }

[targets.cinderbox.jobs.ktlint-check]
runner = "android"
gradle_tasks = [":app:ktlintCheck"]
metadata = { area = "format", modifies_source = false }

[targets.cinderbox.jobs.m17-host]
runner = "command"
command = ["python3", "-m", "unittest", "discover", "-s", "scripts/devtool", "-p", "test_m17_*.py", "-v"]
inputs = ["scripts/devtool/m17_device_qualification.py", "scripts/devtool/test_m17_device_qualification.py", "app/src/androidTest/java/com/sdvsync/qualification/M17OfflineUiDeviceTest.kt", "app/build.gradle.kts"]
metadata = { read_only = true, area = "m17-ui-lifecycle", root_required = false }

[targets.cinderbox.jobs.m18-host]
runner = "command"
command = ["python3", "-m", "unittest", "discover", "-s", "scripts/devtool", "-p", "test_m18_*.py", "-v"]
inputs = ["scripts/devtool/m18_device_qualification.py", "scripts/devtool/test_m18_device_qualification.py", "scripts/devtool/m14_device_qualification.py", "app/src/androidTest/java/com/sdvsync/qualification/M18ProcessRecoveryDeviceTest.kt"]
metadata = { read_only = true, area = "m18-process-recovery", root_required = false }

[targets.cinderbox.jobs.m21-host]
runner = "command"
command = ["python3", "-m", "unittest", "discover", "-s", "scripts/devtool", "-p", "test_m21_*.py", "-v"]
inputs = ["scripts/devtool/m21_campaign.py", "scripts/devtool/m21_scenarios.json", "scripts/devtool/test_m21_campaign.py", "app/src/androidTest/java/com/sdvsync/qualification/M21ReadinessDeviceTest.kt", "app/src/main/java/com/sdvsync/steam/SteamCloudService.kt"]
metadata = { read_only = true, area = "m21-feature-release-readiness", root_required = false }

[targets.cinderbox.jobs.m20-host]
runner = "command"
command = ["python3", "-m", "unittest", "discover", "-s", "scripts/devtool", "-p", "test_m20_*.py", "-v"]
inputs = ["scripts/devtool/m20_qualification.py", "scripts/devtool/m20_scenarios.json", "scripts/devtool/test_m20_qualification.py", "app/src/androidTest/java/com/sdvsync/qualification/M20ConsolidatedDeviceTest.kt", "app/src/androidTest/java/com/sdvsync/qualification/M20OwnedFixtures.kt", "app/src/debug/**"]
metadata = { read_only = true, area = "m20-resilience", root_required = false }

[targets.cinderbox.jobs.m19-host]
runner = "command"
command = ["python3", "-m", "unittest", "discover", "-s", "scripts/devtool", "-p", "test_m19_*.py", "-v"]
inputs = ["scripts/devtool/m19_device_qualification.py", "scripts/devtool/test_m19_device_qualification.py", "scripts/devtool/m14_device_qualification.py", "app/src/androidTest/java/com/sdvsync/qualification/M19InterruptedRecoveryDeviceTest.kt", "app/src/main/java/com/sdvsync/download/GameDownloadRecovery.kt", "app/src/main/java/com/sdvsync/diagnostics/OperationCenterPolicy.kt"]
metadata = { read_only = true, area = "m19-interrupted-recovery", root_required = false }

[targets.cinderbox.jobs.m15-host]
runner = "command"
command = ["python3", "-m", "unittest", "discover", "-s", "scripts/devtool", "-p", "test_m15_*.py", "-v"]
inputs = ["scripts/devtool/m15_device_qualification.py", "scripts/devtool/m14_device_qualification.py", "scripts/devtool/test_m15_device_qualification.py", "app/src/androidTest/java/com/sdvsync/qualification/M15IntegratedDeviceTest.kt"]
metadata = { read_only = true, area = "m15-qualification", root_required = false }

[targets.cinderbox.jobs.earthy-source]
runner = "command"
command = ["python3", "scripts/devtool/ui_d01_gate.py"]
inputs = ["scripts/devtool/ui_d01_gate.py", "scripts/devtool/earthy_ui_source.py", "scripts/devtool/test_ui_earthy.py", "app/src/main/java/com/sdvsync/ui/theme/**", "app/src/main/java/com/sdvsync/ui/screens/SettingsScreen.kt", "app/src/main/java/com/sdvsync/ui/components/**", "app/src/main/java/com/sdvsync/MainActivity.kt", "app/src/main/res/values/strings.xml", "docs/security/M3_RELEASE_POLICY.json"]
metadata = { read_only = true, area = "earthy-ui-d01", root_required = false, device_required = false, evidence = "source-sha256-json", baseline = "M21" }

[targets.cinderbox.jobs.earthy-components-host]
runner = "command"
command = ["python3", "scripts/devtool/ui_d02_gate.py"]
inputs = ["scripts/devtool/ui_d02_source.py", "scripts/devtool/ui_d02_gate.py", "scripts/devtool/test_ui_d02.py", "app/src/main/java/com/sdvsync/ui/components/**", "app/src/main/java/com/sdvsync/ui/screens/SaveViewerScreen.kt", "app/src/androidTest/java/com/sdvsync/qualification/EarthyComponentsDeviceTest.kt", "docs/security/M3_RELEASE_POLICY.json"]
metadata = { read_only = true, area = "earthy-ui-d02", root_required = false, device_required = false, evidence = "source-sha256-json", baseline = "ui-d01-pr29" }

[targets.cinderbox.jobs.earthy-accessibility-host]
runner = "command"
command = ["python3", "scripts/devtool/ui_d03_gate.py"]
inputs = ["scripts/devtool/ui_d03_source.py", "scripts/devtool/ui_d03_gate.py", "scripts/devtool/test_ui_d03.py", "scripts/devtool/ui_d03_device_capture.py", "app/src/main/java/com/sdvsync/ui/theme/EarthyColorSchemes.kt", "app/src/main/java/com/sdvsync/ui/components/StardewBottomBar.kt", "app/src/main/java/com/sdvsync/ui/components/PixelProgressBar.kt", "app/src/main/java/com/sdvsync/ui/components/PixelLoadingSpinner.kt", "app/src/androidTest/java/com/sdvsync/qualification/EarthyD03AccessibilityDeviceTest.kt", "docs/security/M3_RELEASE_POLICY.json"]
metadata = { read_only = true, area = "earthy-ui-d03", device_required = false, evidence = "source-sha256-json", baseline = "ui-d02-ci-39006846654" }

[targets.cinderbox.jobs.m22-host-tests]
runner = "command"
command = ["python3", "-m", "unittest", "discover", "-s", "scripts/devtool", "-p", "test_m22_baseline.py", "-v"]
inputs = ["scripts/devtool/m22_baseline.py", "scripts/devtool/m22_baseline_contract.json", "scripts/devtool/test_m22_baseline.py", "docs/security/M3_RELEASE_POLICY.json", ".devtool.toml"]
metadata = { read_only = true, area = "m22-postmerge-baseline", device_required = false, root_required = false }

[targets.cinderbox.jobs.m22-baseline]
runner = "command"
command = ["python3", "scripts/devtool/m22_baseline.py"]
inputs = ["scripts/devtool/m22_baseline.py", "scripts/devtool/m22_baseline_contract.json", ".devtool.toml", "docs/devtool/**", ".github/workflows/**", "app/src/main/java/com/sdvsync/download/**", "app/src/main/java/com/sdvsync/steam/**", "app/src/main/java/com/sdvsync/cinderbox/**", "app/src/main/java/com/sdvsync/local/**"]
metadata = { read_only = true, area = "m22-postmerge-baseline", device_required = false, root_required = false, evidence = "source-bound-json" }

[targets.cinderbox.jobs.m23-host-tests]
runner = "command"
command = ["python3", "-m", "unittest", "discover", "-s", "scripts/devtool", "-p", "test_m23_discovery.py", "-v"]
inputs = ["scripts/devtool/m23_discovery_gate.py", "scripts/devtool/test_m23_discovery.py", "docs/security/M3_RELEASE_POLICY.json", ".devtool.toml"]
